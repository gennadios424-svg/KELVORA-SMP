# Kelvora SMP settings
refresh-ticks: 60
currency-format: compact

server-address: "kelvorasmp.mcsh.gg"

# Per-world Paper distance settings applied at plugin startup and with /optimize.
performance:
  view-distance: 16
  simulation-distance: 8

# Optional Money rewards for killing hostile mobs. Set enabled: false to disable globally.
mob-payments:
  enabled: true
  rewards:
    ZOMBIE: 3.0
    SKELETON: 3.0
    CREEPER: 4.0
    SPIDER: 2.0
    ENDERMAN: 8.0
    BLAZE: 6.0
    WITCH: 5.0
    PHANTOM: 4.0
    DROWNED: 3.0
    PILLAGER: 4.0
    HOGLIN: 5.0
    PIGLIN_BRUTE: 8.0

# Passive income uses continuous online seconds; offline time is not paid.
# AFK eligibility is configurable; without an AFK integration the plugin cannot detect AFK state.
passive-kelvoras:
  enabled: true
  interval-seconds: 300
  amount: 1.0
  afk-eligible: true
  afk-timeout-seconds: 60
scoreboard:
  title: "&a&lKELVORA SMP"
ranks:
  booster: { label: "Booster", color: "&d", description: "Discord booster perks" }
  sprout: { label: "Sprout", color: "&7", description: "Starting rank · New players" }
  verdant: { label: "Verdant", color: "&a", description: "Early progression · Growing your wealth" }
  emerald: { label: "Emerald", color: "&2", description: "Mid progression · Established players" }
  sovereign: { label: "Sovereign", color: "&b", description: "High rank · Powerful and respected" }
  ascendant: { label: "Ascendant", color: "&6", description: "Top rank · The elite of Kelvora" }
  helper: { label: "Helper", color: "&a", description: "Answers questions and helps players" }
  moderator: { label: "Moderator", color: "&9", description: "Handles chat and rule enforcement" }
  manager: { label: "Manager", color: "&c", description: "Manages server operations" }
  admin: { label: "Admin", color: "&c", description: "Manages server operations" }
  owner: { label: "Owner", color: "&a", description: "Server leadership" }
  staff: { label: "Staff", color: "&c", description: "Server staff" }
  media: { label: "Media", color: "&d", description: "Content creators for Kelvora" }
  creator: { label: "Creator", color: "&d", description: "Content creators for Kelvora" }
  # Compatibility aliases for existing groups
  mod: { label: "Moderator", color: "&9" }
  vip: { label: "Verdant", color: "&a" }
  member: { label: "Member", color: "&7" }
  bootstrap-groups: true
kelvoras:
  placeholder: "%kelvoras_balance%"

