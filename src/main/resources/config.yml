# RTP world names are optional. Leave blank to auto-detect by Bukkit world environment.
# For Multiverse worlds, set the exact loaded world names here.
rtp:
  worlds:
    overworld: ""
    nether: ""
    end: ""

# Home slots use the LuckPerms primary group or matching limit permission.
# Defaults are examples and can be changed to fit the server's actual ranks.
homes:
  default-limit: 3
  rank-limits:
    member: 3
    vip: 5
    kelvora: 8
    mod: 10
    admin: 20
    owner: 20


# Phase 22: Rank progression. Groups are created if missing; existing permissions are preserved.
