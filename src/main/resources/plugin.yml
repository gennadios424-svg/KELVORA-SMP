name: KelvoraSMP
version: 2.15.0
main: net.kelvora.smp.KelvoraSMP
api-version: '1.21'
description: Kelvora SMP economy GUIs, Money coinflip, leaderboard, bounty, and combat tags
softdepend: [LuckPerms, Vault, PlaceholderAPI]
author: Kelvora SMP
commands:
  crate:
    description: Manage and open physical Kelvora crates
    usage: /crate <spawn|remove|list|keys|givekey>
  keyall:
    description: Grant digital crate keys to all online players
    usage: /keyall <type> <amount>
  kelvoratools:
    description: Give Kelvora special tools
    usage: /kelvoratools give <player> <drill|gainer|sellaxe|treetrooper>
  shop:
    description: Open the Kelvora item shop
    usage: /shop
  sell:
    description: Open the Kelvora sell chest
    usage: /sell
  worth:
    description: Browse configured item values
    usage: /worth [search]
    aliases: [itemworth]
  ah:
    description: Open and manage the Kelvora Auction House
    usage: /ah [sell <price>|listings|cancel <id>|help]
    aliases: [auctionhouse, auctions]
  bal:
    description: Show your Money and Kelvoras balances
    usage: /bal
  kelvoras:
    description: View or transfer your separate Kelvoras currency
    usage: /kelvoras [pay <player> <amount>]
  shardshop:
    description: Open the Kelvora cosmetics shop
    usage: /shardshop
  shards:
    description: Show your Kelvoras balance
    usage: /shards
  shardshopreload:
    description: Reload cosmetic configuration without resetting ownership
    usage: /shardshopreload
  rank:
    description: Open the Kelvora rank guide or administer progression ranks
    usage: /rank [set <player> <rank>]
  rankup:
    description: View Discord rank purchase information
    usage: /rankup
  kit:
    description: Open and claim rank kits
    usage: /kit [name|preview <name>]
    aliases: [kits]
  baltop:
    description: Show the richest players by Money balance
    usage: /baltop [page]
  coinflip:
    description: Play Money coinflip challenges
    usage: /coinflip [create <amount>|cancel|history|help]
    aliases: [cf]
  bounty:
    description: Place and browse Money bounties
    usage: /bounty [set <player> <amount>|check <player>|top|list]
    aliases: [bounties]
  rtp:
    description: Open the random teleport dimension menu
    usage: /rtp
    aliases: [randomteleport, wild]
  team:
    description: Create and manage survival teams
    usage: /team [create|invite|join|leave|kick|promote|info|list|disband]
    aliases: [teams]
  sethome:
    description: Save a named home
    usage: /sethome <name>
  home:
    description: Teleport to a saved home or open the homes GUI
    usage: /home [name]
  homes:
    description: Open the saved homes GUI
    usage: /homes
  delhome:
    description: Delete a saved home
    usage: /delhome <name>
permissions:
  kelvora.crate.admin:
    description: Administer physical crates and digital keys
    default: op
  kelvora.tools.admin:
    description: Give Kelvora special tools
    default: op
  kelvora.rank.view:
    description: View the rank guide
    default: true
  kelvora.rankup:
    description: Upgrade progression rank
    default: true
  kelvora.rank.admin:
    description: Assign progression ranks without changing staff/media roles
    default: op
  kelvora.shardshop.use:
    description: Use the Kelvora ShardShop
    default: true
  kelvora.shardshop.admin:
    description: Reload and administer cosmetic configuration
    default: op
  kelvora.kit.use:
    description: Open and claim eligible kits
    default: true
  kelvora.kit.admin:
    description: Administer kits and ranks
    default: op
  kelvora.balance:
    description: View your own currency balances and transfer Kelvoras
    default: true
  kelvora.shop:
    description: Use the Kelvora shop
    default: true
  kelvora.sell:
    description: Use the Kelvora sell chest
    default: true
  kelvora.worth:
    description: Use the worth GUI
    default: true
  kelvora.ah:
    description: Use the Kelvora Auction House
    default: true
  kelvora.coinflip:
    description: Use the Money coinflip system
    default: true
  kelvora.bounty:
    description: Use the Kelvora bounty system
    default: true
  kelvora.bounty.admin:
    description: Recover interrupted bounty payout transactions
    default: op
  kelvora.rtp:
    description: Use random teleport
    default: true
  kelvora.team.admin:
    description: Moderate teams
    default: op
  kelvora.homes.use:
    description: Save and use personal homes
    default: true
  kelvora.homes.admin:
    description: Administrative home management permission
    default: op
  kelvora.homes.limit.unlimited:
    description: Bypass the configured home slot limit
    default: op
