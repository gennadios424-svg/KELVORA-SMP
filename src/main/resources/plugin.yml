name: KelvoraSMP
version: 2.40.0
main: net.kelvora.smp.KelvoraSMP
api-version: '1.21'
description: Kelvora SMP economy GUIs, Money coinflip, leaderboard, bounty, and combat tags
softdepend: [LuckPerms, Vault, PlaceholderAPI, GrimAC]
author: Kelvora SMP
commands:
  setspawn:
    description: Set the server spawn at your current location
    usage: /setspawn
    permission: kelvora.spawn.admin
  spawn:
    description: Open the spawn teleport confirmation menu
    usage: /spawn
    permission: kelvora.spawn.use
  setafk:
    description: Add, list, remove, or clear AFK lounge locations
    usage: /setafk [add|list|remove <number>|clear]
    permission: kelvora.afk.admin
  afk:
    description: Teleport to a random AFK lounge and earn Kelvoras
    usage: /afk
    permission: kelvora.afk.use
  booster:
    description: Claim daily Booster rank keys
    usage: /booster
  sprout:
    description: Claim daily Sprout rank keys
    usage: /sprout
  verdant:
    description: Claim daily Verdant rank keys
    usage: /verdant
  emerald:
    description: Claim daily Emerald rank keys
    usage: /emerald
  sovereign:
    description: Claim daily Sovereign rank keys
    usage: /sovereign
  ascendant:
    description: Claim daily Ascendant rank keys
    usage: /ascendant
  kelvora:
    description: Operator-only Kelvoras administration
    usage: /kelvora give <player> <amount>
  news:
    description: Broadcast an on-screen server announcement
    usage: /news <message>
  daily:
    description: Claim your daily random Money reward
    usage: /daily
  crate:
    description: Manage and open physical Kelvora crates
    usage: /crate [spawn|remove|list|keys|givekey|edit|reload]
  keyall:
    description: Grant digital crate keys to all online players
    usage: /keyall <type> <amount>
  gamble:
    description: Use your daily rank-based reward attempts
    usage: /gamble [remaining]
  rtq:
    description: Join or leave random 1v1 matchmaking
    usage: /rtq [leave|status|admin reload]
  stats:
    description: View public player statistics
    usage: /stats [player]
  leaderboard:
    description: View persistent Kelvora player leaderboards
    usage: /leaderboard [kills|deaths|playtime|money|kelvoras|rank]
  kelvoratools:
    description: Give Kelvora special tools
    usage: /kelvoratools give <player> <drill|gainer|sellaxe|treetrooper>
  shop:
    description: Open the Kelvora item shop
    usage: /shop
  sell:
    description: Open the Kelvora sell chest
    usage: /sell
  worth:
    description: Browse configured item values
    usage: /worth [search]
    aliases: [itemworth]
  meta:
    description: Show Kelvora farming-item values
    usage: /meta
  ah:
    description: Open and manage the Kelvora Auction House
    usage: /ah [sell <price>|listings|cancel <id>|help]
    aliases: [auctionhouse, auctions]
  pay:
    description: Transfer Money to another online player
    usage: /pay <player> <amount>
  mobpay:
    description: Toggle personal mob-kill Money rewards
    usage: /mobpay [on|off|status]
  lagcleaner:
    description: Safely remove unprotected dropped items
    usage: /lagcleaner
    permission: kelvora.admin.optimize
  optimize:
    description: Apply configured world performance distances
    usage: /optimize
    permission: kelvora.admin.optimize
  bal:
    description: Show your Money and Kelvoras balances
    usage: /bal
  kelvoras:
    description: View or transfer your separate Kelvoras currency
    usage: /kelvoras [pay <player> <amount>]
  shardshop:
    description: Open the Kelvora cosmetics shop
    usage: /shardshop
  shards:
    description: Show your Kelvoras balance
    usage: /shards
  shardshopreload:
    description: Reload cosmetic configuration without resetting ownership
    usage: /shardshopreload
  glow:
    description: Toggle an owned ShardShop glow on or off
    usage: /glow
    permission: kelvora.shardshop.use
  tags:
    description: Open owned ShardShop tags to equip or turn off
    usage: /tags
    permission: kelvora.shardshop.use
  chatcolour:
    description: Open owned chat colours to equip or turn off
    usage: /chatcolour
    aliases: [chatcolor]
    permission: kelvora.shardshop.use
  rank:
    description: Open the Kelvora rank guide or administer progression ranks
    usage: /rank [set <player> <rank>]
  rankup:
    description: View Discord rank purchase information
    usage: /rankup
  kit:
    description: Open and claim rank kits
    usage: /kit [name|preview <name>]
    aliases: [kits]
  baltop:
    description: Show the richest players by Money balance
    usage: /baltop [page]
  coinflip:
    description: Play Money coinflip challenges
    usage: /coinflip [create <amount>|cancel|history|help]
    aliases: [cf]
  bounty:
    description: Place and browse Money bounties
    usage: /bounty [set <player> <amount>|check <player>|top|list]
    aliases: [bounties]
  rtp:
    description: Open the random teleport dimension menu
    usage: /rtp
    aliases: [randomteleport, wild]
  settings:
    description: Open personal Kelvora settings
    usage: /settings
    permission: kelvora.settings
  tpa:
    description: Request to teleport to another player
    usage: /tpa <player>
    permission: kelvora.teleport.requests
  tpahere:
    description: Request another player to teleport to you
    usage: /tpahere <player>
    permission: kelvora.teleport.requests
  tpaccept:
    description: Accept an incoming teleport request
    usage: /tpaccept
    aliases: [tpyes]
    permission: kelvora.teleport.requests
  tpdeny:
    description: Deny an incoming teleport request
    usage: /tpdeny
    aliases: [tpno]
    permission: kelvora.teleport.requests
  team:
    description: Create and manage survival teams
    usage: /team [create|invite|join|leave|kick|promote|info|list|disband]
    aliases: [teams]
  sethome:
    description: Save a named home
    usage: /sethome <name>
  home:
    description: Teleport to a saved home or open the homes GUI
    usage: /home [name]
  homes:
    description: Open the saved homes GUI
    usage: /homes
  delhome:
    description: Delete a saved home
    usage: /delhome <name>

  discord:
    description: Get the Kelvora SMP Discord invite
    usage: /discord
  report:
    description: Report a player to online staff
    usage: /report <user> <reason>
  ban:
    description: Ban a player by username
    usage: /ban <player> <reason>
    permission: kelvora.staff.ban
  banip:
    description: Ban an online player's IP or a provided IP address
    usage: /banip <online-player|IP-address> <reason>
    permission: kelvora.staff.ban
  media:
    description: View Media rank requirements and application information
    usage: /media
  live:
    description: Set Media live status and optional video/stream link
    usage: /live [link|on|off]
  role:
    description: Manager role creation and assignment
    usage: /role <list|create|add|remove>
  suslist:
    description: Moderator suspicious mining and player report review list
    usage: /suslist [player|tp <player>|reports|reload]
  vanish:
    description: Toggle staff vanish
    usage: /vanish

permissions:
  kelvora.spawn.admin:
    description: Set the server spawn location
    default: op
  kelvora.spawn.use:
    description: Use the spawn teleport menu
    default: true
  kelvora.afk.admin:
    description: Manage AFK lounge locations
    default: op
  kelvora.afk.use:
    description: Use the AFK lounge
    default: true
  kelvora.admin.optimize:
    description: Run the safe lag cleaner and performance settings
    default: op
  kelvora.roles.manage:
    description: Manage custom server roles
    default: op
  kelvora.staff.manager:
    description: Manage custom server roles
    default: op
  kelvora.staff.mod:
    description: Use moderator investigation tools
    default: op
  kelvora.suslist:
    description: Review suspicious mining flags
    default: op
  kelvora.vanish:
    description: Toggle vanish mode
    default: op
  kelvora.report:
    description: Submit player reports
    default: true
  kelvora.staff.ban:
    description: Ban players and IP addresses
    default: op
  kelvora.staff.zstaff:
    description: Pick up and use the protected ZStaff tool
    default: op
  kelvora.live:
    description: Use Media live status
    default: false
  kelvora.crate.admin:
    description: Administer physical crates and digital keys
    default: op
  kelvora.tools.admin:
    description: Give Kelvora special tools
    default: op
  kelvora.rank.view:
    description: View the rank guide
    default: true
  kelvora.rankup:
    description: Upgrade progression rank
    default: true
  kelvora.rank.admin:
    description: Assign progression ranks without changing staff/media roles
    default: op
  kelvora.shardshop.use:
    description: Use the Kelvora ShardShop
    default: true
  kelvora.shardshop.admin:
    description: Reload and administer cosmetic configuration
    default: op
  kelvora.kit.use:
    description: Open and claim eligible kits
    default: true
  kelvora.kit.admin:
    description: Administer kits and ranks
    default: op
  kelvora.balance:
    description: View your own currency balances and transfer Kelvoras
    default: true
  kelvora.shop:
    description: Use the Kelvora shop
    default: true
  kelvora.sell:
    description: Use the Kelvora sell chest
    default: true
  kelvora.worth:
    description: Use the worth GUI
    default: true
  kelvora.ah:
    description: Use the Kelvora Auction House
    default: true
  kelvora.coinflip:
    description: Use the Money coinflip system
    default: true
  kelvora.bounty:
    description: Use the Kelvora bounty system
    default: true
  kelvora.bounty.admin:
    description: Recover interrupted bounty payout transactions
    default: op
  kelvora.rtp:
    description: Use random teleport
    default: true
  kelvora.settings:
    description: Open personal settings
    default: true
  kelvora.teleport.requests:
    description: Send and accept player teleport requests
    default: true
  kelvora.team.admin:
    description: Moderate teams
    default: op
  kelvora.homes.use:
    description: Save and use personal homes
    default: true
  kelvora.homes.admin:
    description: Administrative home management permission
    default: op
  kelvora.homes.limit.unlimited:
    description: Bypass the configured home slot limit
    default: op
