name: KelvoraSMP
version: 2.6.1
main: net.kelvora.smp.KelvoraSMP
api-version: '1.21'
description: Kelvora SMP economy GUIs, Money coinflip, leaderboard, bounty, and combat tags
softdepend: [LuckPerms, Vault, PlaceholderAPI]
author: Kelvora SMP
commands:
  shop:
    description: Open the Kelvora item shop
    usage: /shop
  sell:
    description: Open the Kelvora sell chest
    usage: /sell
  worth:
    description: Browse configured item values
    usage: /worth [search]
    aliases: [itemworth]
  ah:
    description: Open and manage the Kelvora Auction House
    usage: /ah [sell <price>|listings|cancel <id>|help]
    aliases: [auctionhouse, auctions]
  bal:
    description: Show your Money and Kelvoras balances
    usage: /bal
  kelvoras:
    description: View or transfer your separate Kelvoras currency
    usage: /kelvoras [pay <player> <amount>]
  baltop:
    description: Show the richest players by Money balance
    usage: /baltop [page]
  coinflip:
    description: Play Money coinflip challenges
    usage: /coinflip [create <amount>|cancel|history|help]
    aliases: [cf]
  bounty:
    description: Place and browse Money bounties
    usage: /bounty [set <player> <amount>|check <player>|top|list]
    aliases: [bounties]
  rtp:
    description: Open the random teleport dimension menu
    usage: /rtp
    aliases: [randomteleport, wild]
  sethome:
    description: Save a named home
    usage: /sethome <name>
  home:
    description: Teleport to a saved home or open the homes GUI
    usage: /home [name]
  homes:
    description: Open the saved homes GUI
    usage: /homes
  delhome:
    description: Delete a saved home
    usage: /delhome <name>
permissions:
  kelvora.balance:
    description: View your own currency balances and transfer Kelvoras
    default: true
  kelvora.shop:
    description: Use the Kelvora shop
    default: true
  kelvora.sell:
    description: Use the Kelvora sell chest
    default: true
  kelvora.worth:
    description: Use the worth GUI
    default: true
  kelvora.ah:
    description: Use the Kelvora Auction House
    default: true
  kelvora.coinflip:
    description: Use the Money coinflip system
    default: true
  kelvora.bounty:
    description: Use the Kelvora bounty system
    default: true
  kelvora.bounty.admin:
    description: Recover interrupted bounty payout transactions
    default: op
  kelvora.rtp:
    description: Use random teleport
    default: true
  kelvora.homes.use:
    description: Save and use personal homes
    default: true
  kelvora.homes.admin:
    description: Administrative home management permission
    default: op
  kelvora.homes.limit.unlimited:
    description: Bypass the configured home slot limit
    default: op
