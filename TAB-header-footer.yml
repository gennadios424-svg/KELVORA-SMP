# TAB plugin configuration snippet for Kelvora SMP.
# No custom player-list header is configured. KelvoraSMP sends the required three-line footer.
# Set enabled=false if the TAB plugin overrides the footer from the KelvoraSMP plugin.
header-footer:
  enabled: false
  designs:
    default:
      header: []
      footer:
        - '<aqua>💬 Discord: discord.gg/gUt2uGcwe</aqua>'
        - '<gold>🛒 Store: Coming Soon</gold>'
        - '<gray>🌐 IP: kelvorasmp.mcsh.gg</gray>'
