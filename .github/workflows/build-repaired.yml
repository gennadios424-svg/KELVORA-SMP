name: Build Kelvora SMP plugin

on:
  workflow_dispatch:
  push:
    branches: [main, phase-11-tab-bal-tooltip]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: kelvora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: |
          mvn -B -ntp clean package
          VERSION=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')
          JAR="target/KelvoraSMP-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/KelvoraSMP.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -q "version: ${VERSION}"
      - name: Publish compiled JAR to repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')
          cp "target/KelvoraSMP-${VERSION}.jar" "KelvoraSMP-${VERSION}.jar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "KelvoraSMP-${VERSION}.jar"
          git commit -m "Publish compiled KelvoraSMP ${VERSION} JAR" || echo 'JAR unchanged'
          git push
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-JAR
          path: target/KelvoraSMP-*.jar
          if-no-files-found: error
          retention-days: 14
