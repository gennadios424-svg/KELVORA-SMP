name: Build repaired Kelvora SMP plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build-repaired.yml'

permissions:
  contents: write

concurrency:
  group: kelvora-repair-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: |
          mvn -B -ntp clean package
          test -s target/KelvoraSMP-2.1.1.jar
          jar tf target/KelvoraSMP-2.1.1.jar | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf target/KelvoraSMP-2.1.1.jar | grep -q 'net/kelvora/smp/KelvoraSMP.class'
          jar tf target/KelvoraSMP-2.1.1.jar | grep -q 'plugin.yml'
          unzip -p target/KelvoraSMP-2.1.1.jar plugin.yml | grep -q 'version: 2.1.1'
      - name: Publish compiled JAR to repository
        run: |
          cp target/KelvoraSMP-2.1.1.jar KelvoraSMP-2.1.1.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KelvoraSMP-2.1.1.jar
          git commit -m 'Publish repaired KelvoraSMP 2.1.1 JAR' || echo 'JAR unchanged'
          git push
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-2.1.1
          path: target/KelvoraSMP-2.1.1.jar
          if-no-files-found: error
          retention-days: 14
