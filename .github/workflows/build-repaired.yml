name: Build Kelvora SMP plugin

on:
  workflow_dispatch:
  push:
    branches: [main, phase-11-tab-bal-tooltip]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: kelvora-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: |
          mvn -B -ntp clean package
          VERSION=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')
          JAR="target/KelvoraSMP-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/KelvoraSMP.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/BountyCombatManager.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -q "version: ${VERSION}"
      - name: Paper 1.21.11 startup smoke test
        run: |
          VERSION=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')
          USER_AGENT="KelvoraSMP-CI/1.0 (https://github.com/gennadios424-svg/kelvora-smp)"
          BUILDS=$(curl -fsSL -H "User-Agent: ${USER_AGENT}" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1")
          DOWNLOAD_URL=$(printf '%s' "$BUILDS" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['downloads']['server:default']['url'])")
          curl -fsSL -H "User-Agent: ${USER_AGENT}" "$DOWNLOAD_URL" -o paper-smoke.jar
          mkdir -p smoke/plugins
          cp "target/KelvoraSMP-${VERSION}.jar" smoke/plugins/
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nserver-port=25575\nview-distance=2\nsimulation-distance=2\n' > smoke/server.properties
          cd smoke
          timeout 150s java -Xms512M -Xmx1G -jar ../paper-smoke.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 70); do
            if grep -q 'Done (' server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 2
          done
          if ! grep -q 'Done (' server.log; then cat server.log; kill "$SERVER_PID" 2>/dev/null || true; exit 1; fi
          grep -q 'Auction House loaded' server.log
          grep -q 'Kelvora SMP presentation enabled' server.log
          if grep -E 'Could not load .+ plugin|Error occurred while enabling KelvoraSMP|Exception in thread' server.log; then
            cat server.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo 'Paper 1.21.11 startup smoke test passed.'
      - name: Note canonical publisher
        run: echo 'JAR publishing is handled by build.yml after the smoke test workflow validates startup.'
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-JAR
          path: target/KelvoraSMP-*.jar
          if-no-files-found: error
          retention-days: 14
