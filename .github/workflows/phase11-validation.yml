name: Phase 11 Java 21 build validation

on:
  workflow_dispatch:
  push:
    branches: [phase-11-tab-bal-tooltip]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile plugin and validate JAR
        run: |
          BUILD_OK=0
          for attempt in 1 2 3; do
            if mvn -B -ntp -Dmaven.wagon.http.retryHandler.count=5 clean package; then BUILD_OK=1; break; fi
            if [ "$attempt" -lt 3 ]; then echo "Maven build failed; retrying in 10 seconds ($attempt/3)..."; sleep 10; fi
          done
          if [ "$BUILD_OK" -ne 1 ]; then exit 1; fi
          VERSION=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')
          JAR="target/KelvoraSMP-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/KelvoraSMP.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/MetaManager.class'
          jar tf "$JAR" | grep -q 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -q "version: ${VERSION}"
          unzip -p "$JAR" plugin.yml | grep -q 'meta:'
