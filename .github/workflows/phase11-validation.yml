name: Phase 11 Java 21 build validation

on:
  workflow_dispatch:
  push:
    branches: [phase-11-tab-bal-tooltip]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile plugin and validate JAR
        run: |
          mvn -B -ntp clean package
          test -s target/KelvoraSMP-2.1.4.jar
          jar tf target/KelvoraSMP-2.1.4.jar | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf target/KelvoraSMP-2.1.4.jar | grep -q 'net/kelvora/smp/KelvoraSMP.class'
          jar tf target/KelvoraSMP-2.1.4.jar | grep -q 'plugin.yml'
          unzip -p target/KelvoraSMP-2.1.4.jar plugin.yml | grep -q 'version: 2.1.4'
