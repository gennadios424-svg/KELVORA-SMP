name: Build and verify KelvoraSMP
# Build the current main branch source, verify it, and publish the compiled plugin JAR.
# Uses its own concurrency group so the startup smoke-test workflow cannot cancel publication.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-repaired.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kelvora-build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package for Paper 1.21.11
        id: compile
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package > build.log 2>&1
          result=$?
          tail -n 100 build.log
          exit "$result"
      - name: Determine plugin version
        id: version
        run: echo "version=$(grep -m1 -o '<version>[^<]*</version>' pom.xml | sed 's/<[^>]*>//g')" >> "$GITHUB_OUTPUT"
      - name: Verify compiled plugin JAR
        id: verify
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="target/KelvoraSMP-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'plugin.yml'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/BaltopManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/KelvorasManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/ShardShopManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/CrateManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/StaffFeaturesManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/SpecialToolsManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/ShopSellManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/CoinflipManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/RtpManager.class'
          unzip -p "$JAR" plugin.yml | grep -q 'baltop:'
          unzip -p "$JAR" plugin.yml | grep -q 'meta:'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/MetaManager.class'
          jar tf "$JAR" | grep -q 'net/kelvora/smp/MovementCompatibilityManager.class'
          grep -q 'Mob spawning near me:' src/main/java/net/kelvora/smp/TeleportSettingsManager.java
          jar tf "$JAR" | grep -q 'net/kelvora/smp/SpawnAfkManager.class'
          unzip -p "$JAR" plugin.yml | grep -q 'setspawn:'
          unzip -p "$JAR" plugin.yml | grep -q 'setafk:'
          unzip -p "$JAR" plugin.yml | grep -q 'kelvoras:'
          unzip -p "$JAR" plugin.yml | grep -q 'shardshop:'
          unzip -p "$JAR" plugin.yml | grep -q 'shards:'
          unzip -p "$JAR" plugin.yml | grep -q 'glow:'
          unzip -p "$JAR" plugin.yml | grep -q 'tags:'
          grep -q '"Buy 32"' src/main/java/net/kelvora/smp/ShopSellManager.java
          grep -q '"Buy 64"' src/main/java/net/kelvora/smp/ShopSellManager.java
          unzip -p "$JAR" plugin.yml | grep -q 'live:'
          unzip -p "$JAR" plugin.yml | grep -q 'role:'
          unzip -p "$JAR" plugin.yml | grep -q 'suslist:'
          unzip -p "$JAR" plugin.yml | grep -q 'vanish:'
          unzip -p "$JAR" plugin.yml | grep -q 'crate:'
          unzip -p "$JAR" plugin.yml | grep -q 'keyall:'
          unzip -p "$JAR" plugin.yml | grep -q 'kelvoratools:'
          unzip -p "$JAR" plugin.yml | grep -q 'coinflip:'
          unzip -p "$JAR" plugin.yml | grep -q 'rtp:'
          unzip -p "$JAR" plugin.yml | grep -q "version: ${VERSION}"
          echo "Compiled JAR, coinflip, shop manager, Money leaderboard, and Kelvoras command verified."
      - name: Publish compiled JAR to repository
        id: publish
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="KelvoraSMP-${VERSION}.jar"
          cp "target/${JAR}" "$JAR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$JAR"
          if git diff --cached --quiet; then
            echo "Compiled JAR is already up to date."
          else
            git commit -m "Publish compiled KelvoraSMP ${VERSION} plugin JAR"
            git push
          fi
      - name: Upload JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-${{ steps.version.outputs.version }}
          path: KelvoraSMP-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
