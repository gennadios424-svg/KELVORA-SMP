name: Build and verify KelvoraSMP
# Build the current main branch source, including the latest leaderboard UI.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package for Paper 1.21.11
        id: compile
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package > build.log 2>&1
          result=$?
          tail -n 100 build.log
          exit "$result"
      - name: Verify compiled plugin JAR
        id: verify
        run: |
          test -s target/KelvoraSMP-2.3.0.jar
          jar tf target/KelvoraSMP-2.3.0.jar | grep -q 'plugin.yml'
          jar tf target/KelvoraSMP-2.3.0.jar | grep -q 'net/kelvora/smp/BaltopManager.class'
          jar tf target/KelvoraSMP-2.3.0.jar | grep -q 'net/kelvora/smp/KelvorasManager.class'
          jar tf target/KelvoraSMP-2.3.0.jar | grep -q 'net/kelvora/smp/ShopSellManager.class'
          unzip -p target/KelvoraSMP-2.3.0.jar plugin.yml | grep -q 'baltop:'
          unzip -p target/KelvoraSMP-2.3.0.jar plugin.yml | grep -q 'kelvoras:'
          echo "Compiled JAR, shop manager, Money leaderboard, and Kelvoras command verified."
      - name: Publish compiled JAR to repository
        id: publish
        run: |
          cp target/KelvoraSMP-2.3.0.jar KelvoraSMP-2.3.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f KelvoraSMP-2.3.0.jar
          if git diff --cached --quiet; then
            echo "Compiled JAR is already up to date."
          else
            git commit -m "Publish compiled KelvoraSMP 2.3.0 plugin JAR"
            git push
          fi
      - name: Upload JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-2.3.0
          path: KelvoraSMP-2.3.0.jar
          if-no-files-found: error
          retention-days: 30
