name: Build and verify KelvoraSMP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package for Paper 1.21.11
        id: compile
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean package > build.log 2>&1
          result=$?
          tail -n 100 build.log
          exit "$result"
      - name: Verify compiled plugin JAR
        id: verify
        run: |
          test -s target/KelvoraSMP-2.2.0.jar
          jar tf target/KelvoraSMP-2.2.0.jar | grep -q 'plugin.yml'
          jar tf target/KelvoraSMP-2.2.0.jar | grep -q 'net/kelvora/smp/BaltopManager.class'
          unzip -p target/KelvoraSMP-2.2.0.jar plugin.yml | grep -q 'baltop:'
          echo "Compiled JAR and /baltop registration verified."
      - name: Publish compiled JAR to repository
        id: publish
        run: |
          cp target/KelvoraSMP-2.2.0.jar KelvoraSMP-2.2.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f KelvoraSMP-2.2.0.jar
          if git diff --cached --quiet; then
            echo "Compiled JAR is already up to date."
          else
            git commit -m "Publish compiled KelvoraSMP 2.2.0 plugin JAR"
            git push
          fi
      - name: Upload JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-2.2.0
          path: KelvoraSMP-2.2.0.jar
          if-no-files-found: error
          retention-days: 30
      - name: Record build result for verification
        if: always()
        run: |
          git pull --rebase origin main
          printf 'commit=%s\nstatus=%s\ncompile=%s\nverify=%s\npublish=%s\n' "$GITHUB_SHA" "${{ job.status }}" "${{ steps.compile.outcome }}" "${{ steps.verify.outcome }}" "${{ steps.publish.outcome }}" > build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          if [ -f build.log ]; then git add build.log; fi
          if git diff --cached --quiet; then
            echo "Build status is unchanged."
          else
            git commit -m "Record KelvoraSMP build status"
            git push
          fi
