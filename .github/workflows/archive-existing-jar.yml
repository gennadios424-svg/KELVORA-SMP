name: Archive existing Kelvora SMP JAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-existing-jar.yml'

permissions:
  contents: write

jobs:
  archive-jar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create ZIP containing the existing JAR
        run: zip -j 'KelvoraSMP-2.0.0-jar-archive.zip' 'KelvoraSMP-2.0.0 (2).jar'
      - name: Commit ZIP to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'KelvoraSMP-2.0.0-jar-archive.zip'
          if git diff --cached --quiet; then
            echo 'ZIP already up to date; nothing to commit.'
            exit 0
          fi
          git commit -m 'Add ZIP archive of existing Kelvora SMP JAR'
          git push
