name: Build Kelvora SMP Plugin
on:
  push:
    branches: ["rebuild/clean-source"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload compiled plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KelvoraSMP-3.0.0
          path: target/KelvoraSMP-3.0.0.jar
          if-no-files-found: error